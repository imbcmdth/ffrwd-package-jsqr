name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # ffrwd for the wit package, ffrwd-wasm for the sidecar the built
      # components are described by.
      - name: Install ffrwd and the wit package
        run: |
          pip install ffrwd ffrwd-wasm
          ffrwd install -g ffrwd/wasm
      - name: Install dependencies
        run: npm ci
      - name: Build the components
        run: npm run build
      - name: Describe the components
        run: npm run describe
      - name: Unit tests
        run: npm test
